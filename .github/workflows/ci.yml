name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 会触发 prepare → 构建 bin/ego-cast-worker.mjs
      - run: npm ci

      - run: npm run typecheck
      - run: npm run unit

      # 不需要真实浏览器的冒烟：工具注册、实例租约、会话隔离、观察页 HTTP
      - run: npm run smoke:ci

  # 需要真实 Chromium（smoke-status/flow/shutdown/cast）。GitHub runner 上 Chromium
  # 权限与无头模式都不稳定，因此不设为必过；需要时手动跑 npm test。
  integration:
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Chromium
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser || echo "no chrome"

      - run: |
          node scripts/smoke-status.mjs
          node scripts/smoke-flow.mjs
          node scripts/smoke-shutdown.mjs
          node scripts/smoke-cast.mjs